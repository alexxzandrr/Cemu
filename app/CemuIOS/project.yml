# XcodeGen spec for the Cemu iPadOS app shell.
# The .xcodeproj is generated in CI (`xcodegen generate`) and is not committed,
# so this text file is the single source of truth and can be edited on Windows.
name: CemuIOS

options:
  bundleIdPrefix: io.github.cemuios
  deploymentTarget:
    iOS: "16.0"          # Lowest version we intend to support (Metal 3 arrived in iOS 16). Not tied to iPadOS 27.
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20   # matches Cemu's CMAKE_CXX_STANDARD
    ENABLE_BITCODE: NO

targets:
  CemuIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist   # referenced via INFOPLIST_FILE, must not be copied as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cemuios.CemuIOS
        PRODUCT_NAME: CemuIOS
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"           # iPad only
        ARCHS: arm64
        SWIFT_OBJC_BRIDGING_HEADER: Sources/CemuIOS-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        # Unsigned CI build; the sideloading tool signs on the Windows PC.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
